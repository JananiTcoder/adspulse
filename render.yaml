services:
  - type: web
    name: adspulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adspulse-db
          property: connectionString
      - key: COMPOSIO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: cron
    name: adspulse-daily
    runtime: python
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python -c "
      from app.database import SessionLocal;
      from app.pipeline import run_all;
      db = SessionLocal();
      results = run_all(db);
      db.close();
      print(f'Done: {len(results)} users processed')
      "
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adspulse-db
          property: connectionString
      - key: COMPOSIO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: adspulse-db
    plan: free
